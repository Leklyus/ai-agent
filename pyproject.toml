[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "booker-agent"
version = "0.1.0"
description = "Минимальный AI-агент на LangChain как NL-обёртка над restful-booker API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langchain-gigachat>=0.5.1,<0.6",
    "langchain-core>=0.3,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.5",
]

[project.scripts]
booker = "booker_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/booker_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "live: проверки против реального restful-booker API, запуск только с RUN_LIVE=1",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.coverage.run]
source = ["src/booker_agent"]
